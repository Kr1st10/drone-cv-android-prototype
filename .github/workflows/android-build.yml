name: Android build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore verified model export
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ml/weights/yolo11s-drone-640.onnx
          key: onnx-${{ runner.os }}-${{ hashFiles('ml/model_manifest.json', 'ml/requirements.txt', 'ml/scripts/fetch_and_export.py') }}
      - name: Export pinned model (only on cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/requirements.txt
          python ml/scripts/fetch_and_export.py
      - name: Install and verify model
        run: python ml/scripts/install_android_model.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Check absent and corrupt models are rejected
        shell: bash
        run: |
          model=app/src/main/assets/models/yolo11s-drone-640.onnx
          mv "$model" "$RUNNER_TEMP/verified-model.onnx"
          if ./gradlew --no-daemon :app:verifyDroneModel > "$RUNNER_TEMP/missing.log" 2>&1; then
            echo "Missing model was accepted"; exit 1
          fi
          grep -F 'Model missing:' "$RUNNER_TEMP/missing.log"
          printf corrupt > "$model"
          if ./gradlew --no-daemon :app:verifyDroneModel > "$RUNNER_TEMP/corrupt.log" 2>&1; then
            echo "Corrupt model was accepted"; exit 1
          fi
          grep -F 'Model SHA-256 mismatch' "$RUNNER_TEMP/corrupt.log"
          mv "$RUNNER_TEMP/verified-model.onnx" "$model"
      - name: Build APK, compile device tests, run unit tests and lint
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Verify model packaged in APK
        run: python ml/scripts/verify_apk_model.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: verified-onnx-model
          path: ml/weights/yolo11s-drone-640.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: device-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk

  connected-tests:
    needs: assemble-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: device-apks/app
      - uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: device-apks/test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real ORT, photo and CameraX UI integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none -memory 2048
          script: bash scripts/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-test-results
          path: |
            instrumentation.txt
            instrumentation-logcat.txt
